apiVersion: apps/v1
kind: Deployment
metadata:
  name: fruit-freshness-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: fruit-freshness
  template:
    metadata:
      labels:
        app: fruit-freshness
    spec:
      containers:
      - name: fruit-freshness
        image: fruit-freshness-app
        imagePullPolicy: Never
        ports:
        - containerPort: 5000